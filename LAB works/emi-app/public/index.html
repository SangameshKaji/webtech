<!DOCTYPE html>
<html>
<head>
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h2>EMI Loan Calculator</h2>
    </div>

    <input type="number" id="amount" placeholder="Loan Amount">
    <input type="number" id="tenure" placeholder="Tenure (months)">
    <input type="number" id="rate" placeholder="Interest Rate (%)">

    <div class="buttons">
        <button onclick="clearFields()">Clear</button>
        <button onclick="calculateEMI()">Calculate</button>
    </div>

    <div class="result">
        <strong>Answer:</strong>
        <p id="output">Monthly Payment: --</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
